<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Часы"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><title>Часы</title><style>
:root{color-scheme:dark;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#10151e;--card:#192330;--line:#304052;--text:#f4f7fb;--muted:#aab6c5;--green:#a8f0ce}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#293b4d,transparent 55%),var(--bg);color:var(--text);min-height:100vh}.wrap{max-width:850px;margin:auto;padding:22px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:750}.zone{color:var(--muted);font-size:13px}.hero{text-align:center;padding:38px 0 30px}.eyebrow{color:var(--green);text-transform:uppercase;letter-spacing:.15em;font-size:12px}.time{font-size:clamp(68px,16vw,140px);font-variant-numeric:tabular-nums;letter-spacing:-.07em;line-height:1.1}.date,.muted{color:var(--muted)}.muted{font-size:13px}.tabs,.buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}.btn,button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:10px 15px;background:#243142;color:var(--text)}.btn.active,.primary{background:var(--green);border-color:var(--green);color:#12221b;font-weight:700}.panel{display:none;max-width:650px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}.panel.active{display:block}h2{margin:0 0 12px;font-size:20px}form,.inputs{display:flex;gap:8px;flex-wrap:wrap}input{font:inherit;background:#101923;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}input[type=text]{flex:1;min-width:120px}.list{display:grid;gap:8px;margin-top:14px}.row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#121b26;border-radius:11px;padding:11px}.row span{flex:1}.display{text-align:center;font-size:clamp(44px,10vw,74px);font-variant-numeric:tabular-nums;margin:22px 0}.empty{text-align:center;padding:18px;color:var(--muted)}footer{text-align:center;color:#8491a1;font-size:12px;margin:24px auto;max-width:570px}@media(max-width:520px){.zone{display:none}.panel{padding:16px}.row{gap:7px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">◷ Часы</div><div class="zone" id="zone"></div></header><section class="hero"><div class="eyebrow">Точное местное время</div><div class="time" id="time">00:00:00</div><div class="date" id="date"></div><div class="muted" id="tz"></div></section><nav class="tabs"><button class="btn active" data-tab="alarm">Будильник</button><button class="btn" data-tab="timer">Таймер</button><button class="btn" data-tab="watch">Секундомер</button></nav><section class="panel active" id="alarm"><h2>Будильники</h2><p class="muted">Сигнал сработает, пока страница открыта.</p><form id="alarmForm"><input id="alarmTime" type="time" required aria-label="Время"><input id="alarmName" type="text" maxlength="32" placeholder="Название (необязательно)"><button class="primary">Добавить</button></form><div class="list" id="alarmList"></div></section><section class="panel" id="timer"><h2>Таймер</h2><div class="inputs" style="justify-content:center"><input id="mins" type="number" min="0" max="999" value="5" aria-label="Минуты" style="width:85px"><span class="muted">мин</span><input id="secs" type="number" min="0" max="59" value="0" aria-label="Секунды" style="width:85px"><span class="muted">сек</span></div><div class="display" id="timerDisplay">05:00</div><div class="buttons"><button class="primary" id="timerStart">Старт</button><button id="timerReset">Сбросить</button></div><p class="muted" id="timerStatus" style="text-align:center">Готов к запуску</p></section><section class="panel" id="watch"><h2>Секундомер</h2><div class="display" id="watchDisplay">00:00.00</div><div class="buttons"><button class="primary" id="watchStart">Старт</button><button id="lap" disabled>Круг</button><button id="watchReset">Сбросить</button></div><ol class="list" id="laps"></ol></section><footer>После первой загрузки приложение работает офлайн. Для будильника оставь страницу открытой и включи звук.</footer></main><script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');function clock(){const d=new Date();$('#time').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(pad).join(':');$('#date').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);$('#tz').textContent=new Intl.DateTimeFormat('ru-RU',{timeZoneName:'long'}).formatToParts(d).find(x=>x.type==='timeZoneName')?.value||'';$('#zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone||'Местное время'}clock();setInterval(clock,250);document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))};let ctx;function ring(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();for(let i=0;i<5;i++){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=i%2?880:660;g.gain.setValueAtTime(.001,ctx.currentTime+i*.45);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+i*.45+.03);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.45+.35);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.45);o.stop(ctx.currentTime+i*.45+.36)}}catch{}}let alarms=JSON.parse(localStorage.getItem('clock.alarms')||'[]'),fired=new Set();function save(){localStorage.setItem('clock.alarms',JSON.stringify(alarms));render()}function render(){const el=$('#alarmList');el.innerHTML=alarms.length?alarms.map((a,i)=>'<div class="row"><input type="checkbox" data-toggle="'+i+'" '+(a.on?'checked':'')+' aria-label="Включить"><span><b>'+a.time+'</b> · '+(a.name||'Будильник')+'</span><button data-del="'+i+'">Удалить</button></div>').join(''):'<div class="empty">Пока нет будильников</div>'}render();$('#alarmForm').onsubmit=e=>{e.preventDefault();alarms.push({time:$('#alarmTime').value,name:$('#alarmName').value.trim(),on:true});alarms.sort((a,b)=>a.time.localeCompare(b.time));$('#alarmName').value='';save()};$('#alarmList').onchange=e=>{if(e.target.dataset.toggle!==undefined){alarms[+e.target.dataset.toggle].on=e.target.checked;save()}};$('#alarmList').onclick=e=>{if(e.target.dataset.del!==undefined){alarms.splice(+e.target.dataset.del,1);save()}};setInterval(()=>{let d=new Date(),t=pad(d.getHours())+':'+pad(d.getMinutes()),k=d.toDateString()+t;alarms.forEach((a,i)=>{let id=k+i;if(a.on&&a.time===t&&!fired.has(id)){fired.add(id);ring()}})},1000);
let timer=null,end=0,left=300;function showTimer(){let n=timer?Math.max(0,Math.ceil((end-Date.now())/1000)):left;$('#timerDisplay').textContent=pad(Math.floor(n/60))+':'+pad(n%60);return n}function tick(){if(showTimer()<=0&&timer){clearInterval(timer);timer=null;left=0;$('#timerStart').textContent='Старт';$('#timerStatus').textContent='Время вышло';ring()}}function inputTime(){if(!timer)left=Math.max(0,(+$('#mins').value||0)*60+(+$('#secs').value||0));showTimer()}$('#mins').oninput=inputTime;$('#secs').oninput=inputTime;$('#timerStart').onclick=()=>{if(timer){clearInterval(timer);timer=null;left=Math.max(0,(end-Date.now())/1000);$('#timerStart').textContent='Продолжить';$('#timerStatus').textContent='На паузе';return}if(left<=0)inputTime();if(!left)return;end=Date.now()+left*1000;timer=setInterval(tick,100);$('#timerStart').textContent='Пауза';$('#timerStatus').textContent='Идёт отсчёт';tick()};$('#timerReset').onclick=()=>{clearInterval(timer);timer=null;inputTime();$('#timerStart').textContent='Старт';$('#timerStatus').textContent='Готов к запуску'};let started=0,elapsed=0,sw=null,count=0;function showSw(){let n=elapsed+(sw?Date.now()-started:0),cs=Math.floor(n/10)%100,s=Math.floor(n/1000)%60,m=Math.floor(n/60000);$('#watchDisplay').textContent=pad(m)+':'+pad(s)+'.'+pad(cs)}$('#watchStart').onclick=()=>{if(sw){clearInterval(sw);sw=null;elapsed+=Date.now()-started;$('#watchStart').textContent='Продолжить';$('#lap').disabled=true}else{started=Date.now();sw=setInterval(showSw,30);$('#watchStart').textContent='Пауза';$('#lap').disabled=false}showSw()};$('#lap').onclick=()=>{if(!sw)return;let li=document.createElement('li');li.className='row';li.textContent='Круг '+(++count)+' · '+$('#watchDisplay').textContent;$('#laps').prepend(li)};$('#watchReset').onclick=()=>{clearInterval(sw);sw=null;elapsed=0;count=0;$('#laps').innerHTML='';$('#watchStart').textContent='Старт';$('#lap').disabled=true;showSw()};showTimer();showSw();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
